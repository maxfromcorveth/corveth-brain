<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>Corveth Manifesto - Slide 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            background: #0A0A0A;
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            border-left: 8px solid #CCFF00;
            padding-left: 40px;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 120px;
            line-height: 1.0;
            letter-spacing: -4px;
            text-transform: uppercase;
        }

        .highlight {
            color: #CCFF00;
        }

        .subtitle {
            font-size: 28px;
            color: #888888;
            margin-top: 40px;
            letter-spacing: 2px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: #CCFF00;
        }

        .slide-number {
            font-size: 24px;
            color: #333333;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background: #CCFF00;
            width: 20%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RevOps for founders who <span class="highlight">HATE</span> RevOps consultants</h1>
    </div>

    <div class="subtitle">A MANIFESTO BY CORVETH</div>

    <div class="footer">
        <div class="logo">CORVETH</div>
        <div class="slide-number">1 / 5</div>
    </div>

    <div class="progress-bar"></div>
</body>
</html>
