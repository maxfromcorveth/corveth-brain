<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>RevOps Calculator - Slide 5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            background: #0A0A0A;
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .slide-number {
            font-size: 24px;
            color: #333333;
            text-align: right;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .score-label {
            font-size: 32px;
            color: #888888;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .score {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 200px;
            color: #FF4444;
            line-height: 1;
            margin-bottom: 20px;
        }

        .diagnosis {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: #FFFFFF;
            margin-bottom: 40px;
        }

        .diagnosis-sub {
            font-size: 28px;
            color: #888888;
            margin-bottom: 60px;
        }

        .cta-box {
            background: #CCFF00;
            color: #0A0A0A;
            padding: 32px 64px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .website {
            font-size: 36px;
            color: #FFFFFF;
            text-decoration: none;
            border-bottom: 2px solid #CCFF00;
            padding-bottom: 8px;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background: #CCFF00;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="slide-number">5 / 5</div>

    <div class="content">
        <div class="score-label">IF YOU CHECKED THE YELLOW BOXES...</div>

        <div class="score">100%</div>

        <div class="diagnosis">YOUR REVOPS SUCKS.</div>

        <div class="diagnosis-sub">Your CRM is a mess. We can fix it.</div>

        <a href="https://corveth.com" class="cta-box">GET THE FIX</a>

        <a href="https://corveth.com" class="website">CORVETH.COM</a>

    <div class="progress-bar"></div>

</html>
