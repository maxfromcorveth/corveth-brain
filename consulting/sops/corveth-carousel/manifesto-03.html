<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>Corveth Manifesto - Slide 3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            background: #0A0A0A;
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            padding: 80px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .buzzwords {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 80px;
            color: #1a1a1a;
            text-align: center;
            line-height: 1.8;
            z-index: 0;
        }

        .x-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 400px;
            color: #FF4444;
            z-index: 1;
            opacity: 0.9;
        }

        .slide-number {
            font-size: 24px;
            color: #333333;
            text-align: right;
            margin-bottom: 60px;
            position: relative;
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 2;
            margin-top: auto;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 72px;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 40px;
        }

        .highlight {
            color: #CCFF00;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background: #CCFF00;
            width: 60%;
        }
    </style>
</head>
<body>
    <div class="buzzwords">SYNERGY<br>HOLISTIC<br>CADENCE<br>ALIGNMENT<br>LEVERAGE</div>
    <div class="x-mark">✕</div>

    <div class="slide-number">3 / 5</div>

    <div class="content">
        <h1>Stop paying $20k/month for <span class="highlight">vocabulary lessons.</span></h1>
        <h1 style="color: #FFFFFF;">We don't do slide decks.<br>We fix the data.</h1>
    </div>

    <div class="progress-bar"></div>
</body>
</html>
