<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>RevOps Calculator - Slide 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            background: #0A0A0A;
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            border-left: 8px solid #FF4444;
            padding-left: 40px;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 88px;
            line-height: 1.0;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .highlight {
            color: #FF4444;
        }

        .gauge {
            width: 400px;
            height: 400px;
            border: 30px solid #333333;
            border-radius: 50%;
            position: relative;
            margin: 40px auto;
        }

        .gauge-fill {
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            border: 30px solid #FF4444;
            border-radius: 50%;
            border-top-color: transparent;
            border-right-color: transparent;
            transform: rotate(45deg);
        }

        .gauge-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 180px;
            background: #FF4444;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(70deg);
            border-radius: 4px;
        }

        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #FF4444;
            border-radius: 50%;
        }

        .subtitle {
            font-size: 28px;
            color: #888888;
            margin-top: 40px;
            text-align: center;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 48px;
            color: #CCFF00;
        }

        .slide-number {
            font-size: 24px;
            color: #333333;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background: #CCFF00;
            width: 20%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>The RevOps<br><span class="highlight">Suck-Factor</span><br>Calculator</h1>
    </div>

    <div class="gauge">
        <div class="gauge-fill"></div>
        <div class="gauge-needle"></div>
        <div class="gauge-center"></div>
    </div>

    <div class="subtitle">Are you forecasting... or guessing?</div>

    <div class="footer">
        <div class="logo">CORVETH</div>
        <div class="slide-number">1 / 5</div>
    </div>

    <div class="progress-bar"></div>
</body>
</html>
