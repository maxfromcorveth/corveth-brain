<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <title>Corveth Manifesto - Slide 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            background: #0A0A0A;
            font-family: 'JetBrains Mono', monospace;
            color: #FFFFFF;
            padding: 80px;
            display: flex;
            flex-direction: column;
        }

        .slide-number {
            font-size: 24px;
            color: #333333;
            text-align: right;
            margin-bottom: 60px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .them {
            margin-bottom: 60px;
        }

        .label {
            font-size: 24px;
            color: #666666;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .them-text {
            font-size: 48px;
            color: #666666;
            line-height: 1.4;
        }

        .you {
            border-left: 8px solid #CCFF00;
            padding-left: 40px;
        }

        .you-text {
            font-size: 56px;
            line-height: 1.3;
            color: #FFFFFF;
        }

        .highlight {
            color: #CCFF00;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 8px;
            background: #CCFF00;
            width: 40%;
        }
    </style>
</head>
<body>
    <div class="slide-number">2 / 5</div>

    <div class="content">
        <div class="them">
            <div class="label">THEM</div>
            <div class="them-text">6-month audits.<br>50-page PDFs.<br>"Strategic Alignment."</div>
        </div>

        <div class="you">
            <div class="label">YOU</div>
            <div class="you-text">Just want the CRM<br>to stop <span class="highlight">lying</span> to you.</div>
        </div>
    </div>

    <div class="progress-bar"></div>
</body>
</html>
